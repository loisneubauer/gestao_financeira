<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Redefinir Senha — Gestão Financeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #E4D9F2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card card-login shadow-lg border-0">
        <div class="card-body p-4 text-center">
            <i class="bi bi-key display-4 text-primary mb-2" style="color: #6B4E8E;"></i>
            <h5 class="fw-bold mb-3" style="color: #4A2E6E;">Nova Senha para {{ email }}</h5>

            {% if erro %}
                <div class="alert alert-danger text-start">{{ erro }}</div>
            {% endif %}

            <form method="POST" class="text-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Nova Senha</label>
                    <input type="password" name="nova_senha" class="form-control" placeholder="Mínimo de 8 caracteres" required minlength="8" autofocus>
                </div>
                
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Confirmar Nova Senha</label>
                    <input type="password" name="confirma_senha" class="form-control" placeholder="Digite a nova senha novamente" required minlength="8">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mb-2" style="background-color: #6B4E8E; border-color: #6B4E8E;">Salvar Nova Senha</button>
                <a href="{{ url_for('login') }}" class="btn btn-outline-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
