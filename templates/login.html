<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Login - Gestão Financeira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #E4D9F2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card card-login shadow-lg border-0">
        <div class="card-body p-4 text-center">
            <div class="text-primary mb-3">
                <i class="bi bi-wallet2 display-3" style="color: #6B4E8E;"></i>
            </div>
            <h4 class="fw-bold mb-4" style="color: #4A2E6E;">Gestão Financeira</h4>

            {% if erro %}
                <div class="alert alert-danger text-start">{{ erro }}</div>
            {% endif %}
            {% if sucesso %}
                <div class="alert alert-success text-start">{{ sucesso }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" class="text-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label font-weight-bold">E-mail</label>
                    <input type="email" name="email" class="form-control" required autofocus placeholder="seuemail@gmail.com">
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label mb-0 font-weight-bold">Senha</label>
                        <a href="{{ url_for('esqueci_senha') }}" class="small text-decoration-none text-muted">Esqueci minha senha</a>
                    </div>
                    <input type="password" name="senha" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" style="background-color: #6B4E8E; border-color: #6B4E8E;">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
